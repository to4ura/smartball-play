<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f7d69c">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <title>ねこスマートボール</title>
 <link rel="stylesheet" href="ranking.css?v=20261001ui3">
 <link rel="stylesheet" href="modes.css?v=20261001ui3">
 <style>
 *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#f8e8c5;font-family:system-ui,sans-serif;color:#64452e}
 #stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
 canvas{width:100%;height:100%;display:block;touch-action:none;outline:none;-webkit-user-select:none;user-select:none}
 #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#fff3d8}
 h1{font-size:24px;margin:0 0 20px}p{font-size:14px;line-height:1.8}progress{width:240px;max-width:80vw;accent-color:#c18a4a;height:12px;margin:auto}
 #error{display:none;max-width:420px}button{border:1px solid #c18a4a;background:#fff;border-radius:14px;padding:12px 24px;color:#64452e;font:inherit}
 </style>
 <link rel="stylesheet" href="pop-theme.css?v=20261001ui3">
 <link rel="stylesheet" href="approved-ui.css?v=20261001ui3">
</head>
<body>
 <main id="stage"><canvas id="game" tabindex="0" aria-label="ねこスマートボール。右のレバーを下に引いて離すと発射。左右スワイプで穴を回転。"></canvas></main>
 <section id="loading"><h1>ねこスマートボール</h1><progress id="progress" max="1" value="0"></progress><p id="status" role="status">猫たちを準備しています…</p><div id="error"><p>読み込みができませんでした。SafariまたはChromeで開き直してください。</p><button onclick="location.reload()">もう一度読み込む</button></div></section>
 <script src="ranking-config.js?v=20261001ui3"></script>
 <script src="ranking-store.js?v=20261001ui3"></script>
 <script src="ranking-ui.js?v=20261001ui3"></script>
 <script src="duel-client.js?v=20261001ui3"></script>
 <script src="approved-ui-templates.js?v=20261001ui3"></script>
 <script src="approved-ui.js?v=20261001ui3"></script>
 <script src="modes-ui.js?v=20261001ui3"></script>
 <script>
 const canvas=document.getElementById('game');
 const loading=document.getElementById('loading');
 let failed=false;
 function fail(message){failed=true;console.error(message);document.getElementById('progress').hidden=true;document.getElementById('status').textContent='読み込みを中断しました';document.getElementById('error').style.display='block';loading.style.display='grid';}
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
 const config={
  dataUrl:'Build/Web.data.unityweb?v=20261001033928',
  frameworkUrl:'Build/Web.framework.js.unityweb?v=20261001033928',
  codeUrl:'Build/Web.wasm.unityweb?v=20261001033928',
  streamingAssetsUrl:'StreamingAssets',
  companyName:"to4ura",
  productName:"ねこスマートボール",
  productVersion:"1.18",
  devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
  showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}
 };
 const loader=document.createElement('script');loader.src='Build/Web.loader.js?v=20261001033928';
 loader.onerror=()=>fail('Loader download failed');
 loader.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('progress').value=p;document.getElementById('status').textContent='読み込み中 '+Math.round(p*100)+'%';}).then(instance=>{if(!failed)loading.style.display='none';window.smartball=instance;canvas.focus();window.CatModes.ready();}).catch(fail);
 document.body.appendChild(loader);
 </script>
</body>
</html>
